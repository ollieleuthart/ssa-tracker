<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSA Commission Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1A2E;--surface:#172137;--surface2:#1E2B45;--surface3:#243350;
--border:#2A3A58;--text:#E2E8F0;--text2:#94A3B8;--text3:#64748B;
--teal:#3ECDC6;--green:#34D399;--blue:#60A5FA;--amber:#FBBF24;--red:#F87171;--purple:#A78BFA;
--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.55 Inter,system-ui,sans-serif;
font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
justify-content:center;z-index:99}
.gatebox{background:var(--surface);border:1px solid var(--border);border-radius:14px;
padding:38px 34px;width:340px;text-align:center}
.gatebox h1{font-size:19px;font-weight:700;margin-bottom:6px}
.gatebox p{color:var(--text3);font-size:12.5px;margin-bottom:20px}
input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--border);
border-radius:8px;color:var(--text);padding:11px 13px;font:500 14px Inter,sans-serif;text-align:center}
input[type=password]:focus{outline:none;border-color:var(--teal)}
button.go{margin-top:12px;width:100%;background:var(--teal);color:#08131f;border:0;
border-radius:8px;padding:11px;font:700 14px Inter,sans-serif;cursor:pointer}
#err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1240px;margin:0 auto;padding:26px 22px 70px}
header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:18px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.3px}
.logo span{color:var(--teal)}
.badge{font:500 11px/1.5 var(--mono);color:var(--text3);margin-top:6px;letter-spacing:.2px}
.caveat{background:rgba(96,165,250,.09);border-left:3px solid var(--blue);color:var(--text2);
font-size:12px;padding:9px 13px;border-radius:0 7px 7px 0;margin:14px 0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
nav button{background:var(--surface);border:1px solid var(--border);color:var(--text2);
padding:9px 15px;border-radius:8px;font:600 13px Inter,sans-serif;cursor:pointer}
nav button.on{background:var(--teal);border-color:var(--teal);color:#08131f}
.tab{display:none}.tab.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px 17px}
.kpi .lab{font:600 10px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--text3)}
.kpi .val{font-size:21px;font-weight:700;margin-top:7px}
.kpi .sub{font-size:11.5px;color:var(--text3);margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.pend{color:var(--blue)}
.amb{color:var(--amber)}.tl{color:var(--teal)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:18px 20px;margin-bottom:18px}
.card h2{font-size:14px;font-weight:700;margin-bottom:3px}
.card .hint{font-size:11.5px;color:var(--text3);margin-bottom:14px}
.hero{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.herosub{color:var(--text2);font-size:13.5px;margin-top:9px;max-width:660px}
select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
border-radius:8px;padding:9px 13px;font:600 13.5px Inter,sans-serif;min-width:210px}
select:focus{outline:none;border-color:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font:600 10px var(--mono);letter-spacing:.7px;text-transform:uppercase;
color:var(--text3);padding:9px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 9px;border-bottom:1px solid rgba(42,58,88,.5);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
.son{font:500 11.5px var(--mono);color:var(--teal);white-space:nowrap}
.tw{max-width:250px}
.divL{border-left:2px solid var(--blue)}
.flagrow td{background:rgba(251,191,36,.08)}
.pill{display:inline-block;font:600 10px var(--mono);padding:2px 7px;border-radius:20px;
border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.bars .row{display:grid;grid-template-columns:150px 1fr 108px;gap:11px;align-items:center;margin-bottom:9px}
.bars .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--surface3);border-radius:5px;height:19px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.bars .amt{text-align:right;font-size:12.5px;font-weight:600}
.prog{margin-top:30px}
.progtrack{position:relative;background:var(--surface3);border-radius:7px;height:32px;display:flex;overflow:visible}
.progtrack i{display:block;height:100%}
.progtrack i:first-child{border-radius:7px 0 0 7px}
.line{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--red);z-index:3}
.line::after{content:attr(data-label);position:absolute;top:-19px;left:50%;
transform:translateX(-50%);font:700 10px var(--mono);color:var(--red);white-space:nowrap}
.ticks{position:relative;height:19px;margin-top:5px}
.tick{position:absolute;font:500 9.5px var(--mono);color:var(--text3);transform:translateX(-50%);white-space:nowrap}
.tick::before{content:'';position:absolute;top:-5px;left:50%;width:1px;height:4px;background:var(--border)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);margin-top:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sumbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.est{background:rgba(251,191,36,.09);border-left:3px solid var(--amber);color:var(--text2);
font-size:12px;padding:11px 14px;border-radius:0 7px 7px 0;margin-bottom:16px}
.foot{font-size:11.5px;color:var(--text3);margin-top:12px;line-height:1.7}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.filters button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);
padding:5px 11px;border-radius:16px;font:600 11.5px Inter,sans-serif;cursor:pointer}
.filters button.on{background:var(--teal);border-color:var(--teal);color:#08131f}
.wrap{overflow-x:auto}
.dis{position:fixed;right:18px;bottom:18px;background:var(--surface2);border:1px solid var(--border);
color:var(--text2);padding:10px 15px;border-radius:24px;font:600 12px Inter,sans-serif;
cursor:pointer;z-index:20}
.dis:hover{border-color:var(--teal);color:var(--teal)}
@media(max-width:640px){.hero{font-size:29px}.bars .row{grid-template-columns:96px 1fr 84px}}
</style></head><body>

<div id="gate"><div class="gatebox">
<h1>SSA Commission Tracker</h1><p>Enter the team password</p>
<input type="password" id="pw" autocomplete="off" placeholder="••••••••">

const CAVEAT="All pending deals are based on cash amounts and may change with finance and ACP charges.";

async function check(){
  const v=document.getElementById('pw').value;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h===HASH){document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';render();}
  else{document.getElementById('err').textContent='Incorrect password';}
}
document.getElementById('btn').onclick=check;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')check();});

const fmt=v=>(v<0?'('+'$'+Math.abs(v).toLocaleString('en-AU',{maximumFractionDigits:0})+')'
  :'$'+v.toLocaleString('en-AU',{maximumFractionDigits:0}));
const fmt2=v=>(v<0?'('+'$'+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})+')'
  :'$'+v.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}));
const sgn=v=>v<0?'neg':'pos';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function niceStep(max,target){
  const raw=max/target, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}
function ticks(max){
  const st=niceStep(max,5); let h='';
  for(let v=0;v<=max+.001;v+=st)
    h+=`<div class="tick" style="left:${Math.min(v/max*100,100)}%">${fmt(v)}</div>`;
  const lastT=Math.floor(max/st)*st;
  if(lastT/max<0.93) h+=`<div class="tick" style="left:100%">${fmt(max)}</div>`;
  return `<div class="ticks">${h}</div>`;
}

function rows0(f){
  let rs=D.pending.slice().sort((a,b)=>b.total-a.total);
  if(f==='Away'||f==='Home')rs=rs.filter(d=>d.type===f);
  if(f==='noval')rs=rs.filter(d=>d.total===0);
  return rs.map(d=>{
    const sh=Object.entries(d.allper).sort().map(([k,v])=>`${esc(k)}: ${fmt2(v)}`).join('<br>')||'—';
    return `<tr class="${d.total===0||d.flag?'flagrow':''}">

}

function tab1(){

function pane(p){
  const cover=p.to_cover, prog=Math.max(cover,p.earned+p.pending)*1.06||1;
  const eW=Math.min(p.earned/prog*100,100), pW=Math.min(p.pending/prog*100,100-eW);
  let title,line=true;
  if(p.drawn>0&&p.start<0)title='Progress toward covering retainer + opening balance';
  else if(p.drawn>0)title='Progress toward covering retainer';
  else if(p.start<0)title='Progress toward clearing opening balance';
  else {title='Commission accruing';line=false;}
  const who=p.name==='Full Team'?'The team':p.name, low=p.name==='Full Team'?'the team':p.name;
  const tot=p.name==='Full Team'?' in total':'';
  const sent=`${who} has ${fmt2(p.pending)} in pending commission still to install. Once it does, `+
    (p.projected>=0?`SSA will owe ${low} ${fmt2(Math.abs(p.projected))}`
                   :`${low} will owe SSA ${fmt2(Math.abs(p.projected))}`)+`${tot}.`;
  const sub=[];
  if(p.start<0)sub.push(`${fmt2(Math.abs(p.start))} opening`);
  if(p.retainer>0)sub.push(`${fmt2(p.retainer)} retainer`);
  if(p.adspend>0)sub.push(`${fmt2(p.adspend)} ad spend`);
  let h=`<div class="card">
    <div class="badge" style="margin:0 0 9px">${esc(p.type)} · ${esc(p.note)}</div>
    <div class="hero ${sgn(p.current)}">${fmt2(p.current)}</div>
    <div class="herosub">${esc(sent)}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="lab">Total to cover</div><div class="val amb">${fmt2(cover)}</div>
      <div class="sub">${sub.join(' + ')||'Nothing drawn'}</div></div>
    <div class="kpi"><div class="lab">Earned since ${D.reset}</div><div class="val pos">${fmt2(p.earned)}</div>
      <div class="sub">Installed and locked in</div></div>
    <div class="kpi"><div class="lab">Pending</div><div class="val pend">${fmt2(p.pending)}</div>
      <div class="sub">Not yet installed</div></div>
    <div class="kpi"><div class="lab">Projected</div><div class="val ${sgn(p.projected)}">${fmt2(p.projected)}</div>
      <div class="sub">${p.projected>=0?'✅ SSA OWES':'⛔ TO EARN BACK'}</div></div>
  </div>
  <div class="caveat">${CAVEAT}</div>
  <div class="card"><h2>${title}</h2>
    <div class="hint">${line?'The red line is everything drawn against '+esc(low)+' — opening balance plus every draw since. Green and blue must reach it before SSA is net owing.':'Nothing has been drawn — commission simply accrues.'}</div>
    <div class="prog"><div class="progtrack">
      <i style="width:${eW}%;background:var(--green)"></i>
      <i style="width:${pW}%;background:var(--blue)"></i>
      ${line?`<div class="line" style="left:${Math.min(cover/prog*100,100)}%" data-label="${fmt2(cover)}"></div>`:''}
    </div>${ticks(prog)}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Earned</span>
    <span><i style="background:var(--blue)"></i>Pending</span>
    <span><i style="background:var(--surface3)"></i>Remaining</span>
    ${line?'<span><i style="background:var(--red)"></i>Total to cover</span>':''}</div></div>`;
  const rs=D.pending.filter(d=>p.name==='Full Team'?Object.keys(d.per).length:d.per[p.name]);
  h+=`<div class="card"><h2>Pending deals</h2><div class="hint">${rs.length} deals</div>
    <div class="wrap"><table><thead><tr><th>SON</th><th>Deal</th><th>Stage</th><th>Type</th>
    <th class="n">${p.name==='Full Team'?'Team share':'Their share'}</th></tr></thead><tbody>`;
  rs.sort((a,b)=>{const g=x=>p.name==='Full Team'?Object.values(x.per).reduce((m,n)=>m+n,0):x.per[p.name];
    return g(b)-g(a);});
  rs.forEach(d=>{const v=p.name==='Full Team'?Object.values(d.per).reduce((m,n)=>m+n,0):d.per[p.name];
    h+=`<tr class="${d.flag?'flagrow':''}"><td class="son">${esc(d.son||'—')}</td>
      <td class="tw">${esc(d.deal)}</td>
      <td style="font-size:11.5px;color:var(--text2)">${esc(d.status)}</td>
      <td><span class="pill">${esc(d.type)}</span></td>
      <td class="n pend">${fmt2(v)}</td></tr>`;});
  h+=`</tbody></table></div><div class="foot">${CAVEAT}</div></div>`;
  return h;
}

  <div class="wrap"><table><thead><tr><th>Name</th><th>Type</th><th class="n">Start</th>
  <th class="n">Retainer + ad spend</th><th class="n">Earned</th><th class="n">Current</th>
  <th class="n divL">Pending</th><th class="n">Projected</th></tr></thead><tbody>`;
  D.people.forEach(p=>{
    h+=`<tr><td style="font-weight:600">${esc(p.name)}</td>
      <td style="font-size:11.5px;color:var(--text2)">${esc(p.type)}</td>
      <td class="n">${p.start?fmt2(p.start):'—'}</td>
      <td class="n amb">${p.drawn?fmt2(p.drawn):'—'}</td>
      <td class="n pos">${fmt2(p.earned)}</td>
      <td class="n ${sgn(p.current)}"><strong>${fmt2(p.current)}</strong><br>
        <span style="font-size:10px;font-family:var(--mono)">${p.current>=0?'SSA OWES':'TO EARN BACK'}</span></td>
      <td class="n pend divL">${fmt2(p.pending)}</td>
      <td class="n ${sgn(p.projected)}"><strong>${fmt2(p.projected)}</strong><br>
        <span style="font-size:10px;font-family:var(--mono)">${p.projected>=0?'SSA OWES':'TO EARN BACK'}</span></td></tr>`;});
  const f=D.full;
  h+=`<tr style="background:var(--surface2)"><td style="font-weight:700">FULL TEAM</td><td>—</td>
    <td class="n">${fmt2(f.start)}</td><td class="n amb">${fmt2(f.drawn)}</td>
    <td class="n pos">${fmt2(f.earned)}</td>
    <td class="n ${sgn(f.current)}"><strong>${fmt2(f.current)}</strong></td>
    <td class="n pend divL">${fmt2(f.pending)}</td>
    <td class="n ${sgn(f.projected)}"><strong>${fmt2(f.projected)}</strong></td></tr>`;
  h+=`</tbody></table></div>
  <div class="foot"><strong>Projected = Current + Pending.</strong>
  Current = Start + Earned − (Retainer + ad spend).<br>
  <span class="pos">■</span> owed to the person &nbsp;
  <span class="neg">■</span> to earn back &nbsp;
  <span class="pend">■</span> pending / projected &nbsp;
  <span class="amb">■</span> drawn — a neutral fact, not a debt<br>${CAVEAT}</div></div>`;
  return h;
}

/* ---------------- tab 3 : historic ---------------- */
function tab3(){
  const s=D.historic_summary;
  let h=`<div class="sumbox">
    <div class="kpi"><div class="lab">Installed value</div><div class="val tl">${fmt(s.total_value)}</div></div>
    <div class="kpi"><div class="lab">Commission</div><div class="val tl">${fmt2(s.total_commission)}</div></div>
    <div class="kpi"><div class="lab">Deals logged</div><div class="val">${s.deals}</div></div>
    <div class="kpi"><div class="lab">Flagged rows</div><div class="val amb">${s.flagged}</div></div></div>
  <div class="est"><strong>⚠ Estimate up to ${D.reset}.</strong> Figures before the reset are reconstructed
  from HubSpot and contain known inconsistencies — ${s.flagged} rows flagged below have no install date,
  no deal value, or no attribution recorded. Commission shown is <strong>earned/owed on install</strong>,
  not cash paid. Treat pre-reset totals as an estimate for cross-referencing, not a settled ledger.</div>
  <div class="card"><h2>Historic deals</h2>
  <div class="hint">Installed before ${D.reset} · newest first · reference only, not counted in current positions</div>
  <div class="wrap"><table><thead><tr><th>SON</th><th>Deal</th><th>Installed</th>
  <th>Lead Gen / Specialist</th><th>Type</th><th class="n">Value</th><th class="n">Commission</th>
  <th>Flag</th></tr></thead><tbody>`;
  D.historic.forEach(d=>{
    h+=`<tr class="${d.flag?'flagrow':''}"><td class="son">${esc(d.son||'—')}</td>
      <td class="tw">${esc(d.deal)}</td><td style="white-space:nowrap">${esc(d.installed)}</td>
      <td class="tw" style="font-size:11.5px;color:var(--text2)">${esc(d.lg.join(', ')||'—')}<br>
        <span style="color:var(--text3)">${esc(d.spec.join(', ')||'—')}</span></td>
      <td><span class="pill">${esc(d.type)}</span></td>
      <td class="n">${fmt(d.value)}</td><td class="n tl">${fmt2(d.commission)}</td>
      <td class="amb" style="font-size:11px">${esc(d.flag||'')}</td></tr>`;});
  h+=`</tbody></table></div></div>`;
  return h;
}

function render(){
  document.getElementById('badge').textContent =
    `RESET · ${D.reset} baseline · HubSpot pull ${D.pull} · ad spend to ${D.adspend_to}`;
  document.getElementById('t0').innerHTML=tab0();
  document.getElementById('t1').innerHTML=tab1();
  document.getElementById('t2').innerHTML=tab2();
  document.getElementById('t3').innerHTML=tab3();
  document.getElementById('b0').innerHTML=rows0('all');
  document.querySelectorAll('#f0 button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#f0 button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); document.getElementById('b0').innerHTML=rows0(b.dataset.f);});
  const sel=document.getElementById('who');
  const all=[D.full,...D.people];
  const draw=()=>document.getElementById('pane').innerHTML=pane(all[+sel.value]);
  sel.onchange=draw; draw();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); document.getElementById('t'+b.dataset.t).classList.add('on');});
document.getElementById('dis').onclick=()=>{
  const s=encodeURIComponent('SSA Commission Tracker — possible discrepancy ('+D.pull+')');
  const b=encodeURIComponent('Which person / deal:\n\nWhat looks wrong:\n\nWhat you expected:\n\n'+
    '---\nTracker pull '+D.pull+', reset '+D.reset+' baseline.');
  window.location.href='mailto:ollie@smartswitchappliances.com.au?subject='+s+'&body='+b;};
</script></body></html>
