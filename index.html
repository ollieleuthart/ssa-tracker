<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ampra — Commission Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* Ampra design tokens — values typed from assets/tokens.css, never eyedropped */
:root{
--burgundy:#4A1513; --red:#E23723; --gold:#FFC700; --white:#FFFFFF;
--paper:#FBF6E6; --paper-shade:#F3ECD8;
--red-deep:#B82718; --burgundy-65:#7A5450;
/* functional — product UI only, never marketing */
--success:#166B42; --caution:#8A5A00; --error:#A8172B; --info:#1F5B7A;
--text:var(--burgundy); --muted:var(--burgundy-65); --line:rgba(74,21,19,.14);
--display:"Bricolage Grotesque","Archivo","Helvetica Neue",Arial,sans-serif;
--body:"DM Sans","Helvetica Neue",Arial,sans-serif;
--script:"Yellowtail","Brush Script MT",cursive;
--r-sm:4px; --r-md:8px; --r-lg:16px; --r-full:999px;
--keyline:2px; --shadow:3px 3px 0 rgba(74,21,19,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--text);
font:400 17px/1.6 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,.hero{font-family:var(--display);letter-spacing:-.02em}
#gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
justify-content:center;z-index:99;padding:20px}
.gatebox{background:var(--white);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-lg);box-shadow:var(--shadow);padding:38px 34px;width:min(400px,94vw);text-align:center}
.gatelogo{width:150px;height:auto;margin:0 auto 20px;display:block}
.gatebox h1{font-size:24px;font-weight:800;margin-bottom:6px;line-height:1.2}
.gatebox p{color:var(--muted);font-size:17px;margin-bottom:22px;line-height:1.5}
input[type=password]{width:100%;background:var(--white);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-sm);color:var(--text);padding:12px 14px;font:400 17px var(--body);text-align:center}
input[type=password]:focus{outline:3px solid var(--gold);outline-offset:1px}
button.go{margin-top:14px;width:100%;background:var(--red);color:var(--white);
border:var(--keyline) solid var(--burgundy);border-radius:var(--r-md);padding:13px;
font:700 19px var(--body);cursor:pointer;box-shadow:var(--shadow)}
button.go:hover{background:var(--red-deep)}
#err{color:var(--error);font-size:14px;margin-top:12px;min-height:18px;font-weight:500}
.gatefoot{color:var(--muted);font-size:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sliphead{background:var(--burgundy);color:var(--white);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-lg);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.sliphead .eyebrow{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
color:var(--gold)}
.sliphead h2{font-size:32px;font-weight:800;margin:8px 0 2px;color:var(--white)}
.sliphead .cyc{font-size:15px;color:rgba(255,255,255,.72)}
.slipkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:20px}
.slipkpi{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,199,0,.35);
border-radius:var(--r-md);padding:13px 15px}
.slipkpi.lead{background:var(--gold);border-color:var(--gold)}
.slipkpi .k{font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;
color:rgba(255,255,255,.7)}
.slipkpi.lead .k{color:var(--burgundy)}
.slipkpi .v{font:800 26px/1.1 var(--display);letter-spacing:-.02em;color:var(--white);margin-top:6px}
.slipkpi.lead .v{color:var(--burgundy)}
.slipkpi .n{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px}
.slipkpi.lead .n{color:rgba(74,21,19,.7)}
.sliptabs{display:flex;border-bottom:var(--keyline) solid var(--burgundy);margin-bottom:0}
.sliptabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;
padding:13px 10px;font:700 15px var(--body);color:var(--muted);cursor:pointer}
.sliptabs button.on{color:var(--burgundy);border-bottom-color:var(--red)}
.slippane{display:none;padding-top:6px}.slippane.on{display:block}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
padding:14px 4px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qname{font-size:16px;font-weight:500}
.qsub{font-size:13px;color:var(--muted);margin-top:2px}
.qamt{font-size:17px;font-weight:700;white-space:nowrap}
.qtag{display:inline-block;font:700 12px var(--body);padding:3px 10px;border-radius:var(--r-full);
background:rgba(22,107,66,.1);color:var(--success);border:1.5px solid var(--success);white-space:nowrap}
.slipacts{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.approve{background:var(--burgundy);color:var(--white);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-md);padding:16px;font:700 17px var(--body);cursor:pointer;box-shadow:var(--shadow)}
.approve:hover{background:var(--red-deep);border-color:var(--red-deep)}
.approve:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.flagbtn{background:var(--white);color:var(--burgundy);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-md);padding:14px;font:700 15px var(--body);cursor:pointer}
.flagbtn:hover{background:var(--paper-shade)}
.calc{font-size:15px;line-height:1.65}
.calc h4{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
color:var(--muted);margin:18px 0 7px}
.calcrow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
border-bottom:1px solid var(--line);font-size:15px}
.calcrow b{font-variant-numeric:tabular-nums}
.calctot{border-top:var(--keyline) solid var(--burgundy);border-bottom:0;font-weight:700;margin-top:4px}
.lifetime{background:var(--paper);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-lg);padding:18px 20px 4px;margin-bottom:22px;box-shadow:var(--shadow)}
.lifehead{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
color:var(--burgundy);margin-bottom:14px}
.lifehead span{display:block;font:400 14px var(--body);letter-spacing:0;text-transform:none;
color:var(--muted);margin-top:4px}
.lifetime .kpi{background:var(--white)}
.pickcard{display:flex;align-items:stretch;gap:28px;flex-wrap:wrap}
.pickleft{flex:0 1 330px;min-width:260px}
.pickleft select{width:100%;margin-top:4px}
#patchslot{flex:1 1 320px;display:flex;min-width:0}
/* Fills the slot: full width, and height driven by the heading + dropdown column. */
.patch{position:relative;display:flex;align-items:center;justify-content:center;
width:100%;height:100%;flex:1 1 auto;min-height:126px}
.patchshape{position:absolute;inset:0;width:100%;height:100%;
filter:drop-shadow(3px 3px 0 rgba(74,21,19,.16))}
.po{fill:var(--paper);stroke:var(--burgundy);stroke-width:2;vector-effect:non-scaling-stroke}
.pi{fill:none;stroke:var(--burgundy);stroke-width:1.5;stroke-dasharray:7 5;opacity:.5;
vector-effect:non-scaling-stroke}
.patch b{position:relative;z-index:1;font:400 clamp(30px,4.2vw,46px)/1.05 var(--script);
color:var(--red-deep);font-weight:400;white-space:nowrap;padding:0 8%}
#app{display:none;max-width:1240px;margin:0 auto;padding:26px 22px 80px}
header{border-bottom:var(--keyline) solid var(--burgundy);padding:6px 0 20px;margin-bottom:22px;
display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:28px;min-width:0}
/* Lockup proportions are locked artwork - scale the whole mark, never its parts.
   Clear space is at least the beak height on all sides (logo.md). */
.brandmark{width:248px;height:auto;display:block;flex:none}
.wordmark{font:800 44px/1 var(--display);letter-spacing:-.025em;white-space:nowrap;
padding-left:28px;border-left:var(--keyline) solid var(--burgundy)}
.badge{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.caveat{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--info);
color:var(--text);font-size:14px;padding:11px 15px;border-radius:0 var(--r-md) var(--r-md) 0;margin:16px 0}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
nav button{background:var(--white);border:var(--keyline) solid var(--burgundy);color:var(--burgundy);
padding:10px 17px;border-radius:var(--r-md);font:700 15px var(--body);cursor:pointer}
nav button:hover{background:var(--paper-shade)}
nav button.on{background:var(--burgundy);color:var(--white)}
.tab{display:none}.tab.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--white);border:var(--keyline) solid var(--burgundy);border-radius:var(--r-lg);
padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lab{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:800 30px/1.15 var(--display);letter-spacing:-.025em;margin-top:8px}
.kpi .sub{font-size:14px;color:var(--muted);margin-top:5px;line-height:1.45}
.pos{color:var(--success)}.neg{color:var(--error)}.pend{color:var(--info)}
.amb{color:var(--caution)}.tl{color:var(--burgundy)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.dot.pos{background:var(--success)}.dot.neg{background:var(--error)}
.card{background:var(--white);border:var(--keyline) solid var(--burgundy);border-radius:var(--r-lg);
padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h2{font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.card .hint{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.5;max-width:68ch}
.hero{font-size:44px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.herosub{color:var(--text);font-size:17px;margin-top:12px;max-width:68ch;line-height:1.6}
select{background:var(--white);border:var(--keyline) solid var(--burgundy);color:var(--text);
border-radius:var(--r-sm);padding:11px 14px;font:500 17px var(--body);min-width:230px}
select:focus{outline:3px solid var(--gold);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
color:var(--muted);padding:10px 9px;border-bottom:var(--keyline) solid var(--burgundy);white-space:nowrap}
td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
tbody tr:nth-child(even) td{background:var(--paper)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
.son{font:500 13px var(--body);color:var(--burgundy);white-space:nowrap}
.tw{max-width:250px}
.divL{border-left:3px solid var(--info)}
.flagrow td{background:var(--paper-shade)!important}
.pill{display:inline-block;font:700 12px var(--body);padding:2px 9px;border-radius:var(--r-full);
border:1.5px solid var(--burgundy);color:var(--burgundy);white-space:nowrap;background:var(--white)}
.bars .row{display:grid;grid-template-columns:170px 1fr 118px;gap:12px;align-items:center;margin-bottom:10px}
.bars .nm{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--paper-shade);border:1.5px solid var(--burgundy);border-radius:var(--r-sm);
height:22px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.bars .amt{text-align:right;font-size:15px;font-weight:700}
.prog{margin-top:34px}
.progtrack{position:relative;background:var(--paper-shade);border:var(--keyline) solid var(--burgundy);
border-radius:var(--r-sm);height:34px;display:flex;overflow:visible}
.progtrack i{display:block;height:100%}
.line{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--error);z-index:3}
.line::after{content:attr(data-label);position:absolute;top:-21px;left:50%;
transform:translateX(-50%);font:700 13px var(--body);color:var(--error);white-space:nowrap}
.ticks{position:relative;height:22px;margin-top:7px}
.tick{position:absolute;font:500 12px var(--body);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tick::before{content:'';position:absolute;top:-6px;left:50%;width:1px;height:5px;background:var(--burgundy)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--text);margin-top:15px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;
vertical-align:-1px;border:1px solid var(--burgundy)}
.sumbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:18px}
.est{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--caution);
color:var(--text);font-size:14px;padding:13px 16px;border-radius:0 var(--r-md) var(--r-md) 0;
margin-bottom:18px;line-height:1.55}
.foot{font-size:14px;color:var(--muted);margin-top:14px;line-height:1.65}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:var(--white);border:1.5px solid var(--burgundy);color:var(--burgundy);
padding:6px 13px;border-radius:var(--r-full);font:700 13px var(--body);cursor:pointer}
.filters button.on{background:var(--gold);color:var(--burgundy)}
.wrap{overflow-x:auto}
.dis{position:fixed;right:20px;bottom:20px;background:var(--gold);border:var(--keyline) solid var(--burgundy);
color:var(--burgundy);padding:12px 18px;border-radius:var(--r-full);font:700 15px var(--body);
cursor:pointer;z-index:20;box-shadow:var(--shadow)}
.dis:hover{background:var(--burgundy);color:var(--gold)}
.info{width:13px;height:13px;vertical-align:-2px;margin-left:5px;fill:var(--burgundy-65);cursor:help}
#modal{position:fixed;inset:0;background:rgba(74,21,19,.55);display:none;align-items:center;
justify-content:center;z-index:60;padding:18px}
#modal.on{display:flex}
.mbox{background:var(--white);border:var(--keyline) solid var(--burgundy);border-radius:var(--r-lg);
box-shadow:var(--shadow);padding:26px 28px;width:min(500px,94vw)}
.mbox h3{font-size:24px;font-weight:700;margin-bottom:4px}
.msub{font-size:14px;color:var(--muted);margin-bottom:18px}
.mctx{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--burgundy);
border-radius:0 var(--r-md) var(--r-md) 0;font:500 14px var(--body);color:var(--text);
padding:10px 13px;margin-bottom:17px}
.mlab{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
color:var(--muted);display:block;margin-bottom:6px}
.mbox input[type=text],.mbox textarea{width:100%;background:var(--white);
border:var(--keyline) solid var(--burgundy);border-radius:var(--r-sm);color:var(--text);
padding:11px 13px;font:400 17px var(--body);margin-bottom:16px;resize:vertical}
.mbox input[type=text]:focus,.mbox textarea:focus{outline:3px solid var(--gold);outline-offset:1px}
.macts{display:flex;gap:10px;justify-content:flex-end}
.macts button{border-radius:var(--r-md);padding:11px 20px;font:700 15px var(--body);cursor:pointer;
border:var(--keyline) solid var(--burgundy)}
.mcancel{background:var(--white);color:var(--burgundy)}
.msend{background:var(--red);color:var(--white);box-shadow:var(--shadow)}
.msend:hover:not(:disabled){background:var(--red-deep)}
.msend:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media(max-width:640px){.patch{min-height:104px}
.hero{font-size:32px}.kpi .val{font-size:25px}
.bars .row{grid-template-columns:104px 1fr 92px}.brandmark{width:110px}}
</style></head><body>

const fmt=v=>(v<0?'('+'$'+Math.abs(v).toLocaleString('en-AU',{maximumFractionDigits:0})+')'
  :'$'+v.toLocaleString('en-AU',{maximumFractionDigits:0}));
const fmt2=v=>(v<0?'('+'$'+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})+')'
  :'$'+v.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}));
const sgn=v=>v<0?'neg':'pos';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Stitched oval - a plain ellipse. preserveAspectRatio="none" lets it fill the slot at
// any proportion; non-scaling-stroke keeps the keyline an even 2px however it stretches.
const patchHTML=n=>`<div class="patch">
  <svg class="patchshape" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true">
    <ellipse class="po" cx="200" cy="75" rx="198" ry="73"/>
    <ellipse class="pi" cx="200" cy="75" rx="182" ry="58"/>
  </svg><b>${esc(n)}</b></div>`;
const INFO=`<svg class="info" viewBox="0 0 24 24"><title>__T__</title><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>`;
const info=t=>INFO.replace('__T__',t);
function niceStep(max,target){
  const raw=max/target, p=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}
function ticks(max){
  const st=niceStep(max,5); let h='';
  for(let v=0;v<=max+.001;v+=st)
    h+=`<div class="tick" style="left:${Math.min(v/max*100,100)}%">${fmt(v)}</div>`;
  const lastT=Math.floor(max/st)*st;
  if(lastT/max<0.93) h+=`<div class="tick" style="left:100%">${fmt(max)}</div>`;
  return `<div class="ticks">${h}</div>`;
}

function pane(p){
  const cover=p.to_cover, prog=Math.max(cover,p.earned+p.pending)*1.06||1;
  const eW=Math.min(p.earned/prog*100,100), pW=Math.min(p.pending/prog*100,100-eW);
  let title,line=true;
  if(p.drawn>0&&p.start<0)title='Progress toward covering retainer + opening balance';
  else if(p.drawn>0)title='Progress toward covering retainer';
  else if(p.start<0)title='Progress toward clearing opening balance';
  else {title='Commission accruing';line=false;}
  const who=p.name==='Full Team'?'The team':p.name, low=p.name==='Full Team'?'the team':p.name;
  const tot=p.name==='Full Team'?' in total':'';
  const sent=`${who} has ${fmt2(p.pending)} in pending commission still to install. Once it does, `+
    (p.projected>=0?`Ampra will owe ${low} ${fmt2(Math.abs(p.projected))}`
                   :`${low} will owe Ampra ${fmt2(Math.abs(p.projected))}`)+`${tot}.`;
  const sub=[];
  if(p.start<0)sub.push(`${fmt2(Math.abs(p.start))} opening`);
  if(p.retainer>0)sub.push(`${fmt2(p.retainer)} retainer`);
  if(p.adspend>0)sub.push(`${fmt2(p.adspend)} ad spend`);
  // Yellowtail appears once per surface, on the name patch only - never the tagline,
  // which the lockup already carries in its own locked treatment.
  const first=p.name==='Full Team'?null:p.name.split(' ')[0];
  let h=`<div class="card">

  <div class="kpis">
    <div class="kpi"><div class="lab">Total to cover${info('Opening balance plus every retainer draw and ad spend since 20/07/26. Commission must reach this before Ampra is net owing.')}</div><div class="val amb">${fmt2(cover)}</div>
      <div class="sub">${sub.join(' + ')||'Nothing drawn'}</div></div>
    <div class="kpi"><div class="lab">Earned since ${D.reset}</div><div class="val pos">${fmt2(p.earned)}</div>
      <div class="sub">${p.confirmed>0?fmt2(p.confirmed)+' reconciled · '+fmt2(p.estimated)+' still estimated':'Installed and locked in'}</div></div>
    <div class="kpi"><div class="lab">Pending${info('Commission on deals not yet installed. Based on cash amounts and may change with finance and ACP charges.')}</div><div class="val pend">${fmt2(p.pending)}</div>
      <div class="sub">Not yet installed</div></div>
    <div class="kpi"><div class="lab">Projected${info('Current position plus pending commission, once the pipeline installs.')}</div><div class="val ${sgn(p.projected)}">${fmt2(p.projected)}</div>
      <div class="sub"><span class="dot ${sgn(p.projected)}"></span>${p.projected>=0?'AMPRA OWES':'TO EARN BACK'}</div></div>
  </div>
  <div class="caveat">${CAVEAT}</div>
  ${p.confirmed>0?`<div class="caveat" style="border-left-color:var(--success)">
    <strong>${fmt2(p.confirmed)} reconciled.</strong> Confirmed against Xero net revenue after ACP and
    finance fee adjustments — these figures are final. The remaining ${fmt2(p.estimated)} is still an
    estimate until those deals are reconciled.</div>`:''}
  <div class="card"><h2>${title}</h2>
    <div class="hint">${line?'The red line is everything drawn against '+esc(low)+' — opening balance plus every draw since. Green and blue must reach it before Ampra is net owing.':'Nothing has been drawn — commission simply accrues.'}</div>
    <div class="prog"><div class="progtrack">
      <i style="width:${eW}%;background:var(--success)"></i>
      <i style="width:${pW}%;background:var(--info)"></i>
      ${line?`<div class="line" style="left:${Math.min(cover/prog*100,100)}%" data-label="${fmt2(cover)}"></div>`:''}
    </div>${ticks(prog)}</div>
    <div class="legend"><span><i style="background:var(--success)"></i>Earned</span>
    <span><i style="background:var(--info)"></i>Pending</span>
    <span><i style="background:var(--paper-shade)"></i>Remaining</span>
    ${line?'<span><i style="background:var(--error)"></i>Total to cover</span>':''}</div></div>`;
  const rs=D.pending.filter(d=>p.name==='Full Team'?Object.keys(d.per).length:d.per[p.name]);
  h+=`<div class="card"><h2>Pending deals</h2><div class="hint">${rs.length} deals</div>
    <div class="wrap"><table><thead><tr><th>SON</th><th>Deal</th><th>Stage</th><th>Type</th>

    <div class="slippane on" id="sp0">`;
  if(!deals.length){
    h+=`<div class="hint" style="margin:18px 0 0">No deals reconciled this cycle.
      Commission appears here once finance confirms the Xero figures.</div>`;
  } else {
    h+=`<div style="display:flex;justify-content:space-between;padding:12px 4px;
      border-bottom:var(--keyline) solid var(--burgundy)">
      <span class="lab" style="font:700 12px var(--display);letter-spacing:.16em;
      text-transform:uppercase;color:var(--muted)">Qualified deals</span>
      <span style="font-weight:700">${deals.length}</span></div>`;
    deals.slice().sort((a,b)=>b.share-a.share).forEach(d=>{
      h+=`<div class="qrow"><div>

  }
  h+=`<div class="slipacts">
      <button class="approve" id="approve"${(deals.length&&!team)?'':' disabled'}>${team?'Approve individually':'Approve commission'}</button>
      <button class="flagbtn" id="flagslip">Flag an issue</button>
    </div>
    <div class="foot">${team
      ? 'This is the combined team position. Commission is approved person by person — choose someone from the dropdown to approve theirs.'

    <h4>How the pot is worked out</h4>`;
  deals.forEach(d=>{
    h+=`<div class="calcrow"><span>${esc(d.deal.split(' - ')[0])} — net revenue</span><b>${fmt2(d.net_revenue)}</b></div>

    less any finance fees. It is already GST-exclusive, so nothing is divided by 1.1.</p>

  return h;
}

      <td><span class="pill">${esc(d.type)}</span></td>
      <td class="n">${fmt(d.value)}</td><td class="n tl">${fmt2(d.commission)}</td>
      <td class="amb" style="font-size:11px">${esc(d.flag||'')}</td></tr>`;});
  h+=`</tbody></table></div></div>`;
  return h;
}

function render(){
  document.getElementById('badge').textContent =
    `SINCE ${D.reset} · HubSpot pull ${D.pull} · ad spend to ${D.adspend_to}`;
  document.getElementById('t0').innerHTML=tab0();
  document.getElementById('t1').innerHTML=tab1();
  document.getElementById('t2').innerHTML=tab2();
  document.getElementById('t3').innerHTML=tab3();
  document.getElementById('t4').innerHTML=tab4();
  document.getElementById('b0').innerHTML=rows0('all');
  document.querySelectorAll('#f0 button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#f0 button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); document.getElementById('b0').innerHTML=rows0(b.dataset.f);});
  const ssel=document.getElementById('slipwho');
  const drawSlip=()=>{
    const p=[{name:'Full Team'},...D.people][+ssel.value];
    document.getElementById('slippane').innerHTML=slip(p);
    document.querySelectorAll('.sliptabs button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.sliptabs button').forEach(x=>x.classList.remove('on'));
      document.querySelectorAll('.slippane').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); document.getElementById('sp'+b.dataset.s).classList.add('on');});
    const ap=document.getElementById('approve');
    if(ap) ap.onclick=()=>approveSlip(p);
    document.getElementById('flagslip').onclick=()=>{ctxPerson=p.name;openModal();};
  };
  ssel.onchange=drawSlip; drawSlip();
  const sel=document.getElementById('who');
  const all=[D.full,...D.people];
  const draw=()=>{
    const p=all[+sel.value];
    document.getElementById('pane').innerHTML=pane(p);
    const first=p.name==='Full Team'?null:p.name.split(' ')[0];
    document.getElementById('patchslot').innerHTML=first?patchHTML(first):'';
  };
  sel.onchange=draw; draw();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); document.getElementById('t'+b.dataset.t).classList.add('on');});
const TABNAMES=['Pipeline Forecast','My Position','Team List','Historic Deals Log','Commission Slip'];
function ctxNow(){
  const tab=document.querySelector('nav button.on');
  const label=tab?TABNAMES[+tab.dataset.t]:'—';
  const ssel=document.getElementById('slipwho');
  const drawSlip=()=>{
    const p=[{name:'Full Team'},...D.people][+ssel.value];
    document.getElementById('slippane').innerHTML=slip(p);
    document.querySelectorAll('.sliptabs button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.sliptabs button').forEach(x=>x.classList.remove('on'));
      document.querySelectorAll('.slippane').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); document.getElementById('sp'+b.dataset.s).classList.add('on');});
    const ap=document.getElementById('approve');
    if(ap) ap.onclick=()=>approveSlip(p);
    document.getElementById('flagslip').onclick=()=>{ctxPerson=p.name;openModal();};
  };
  ssel.onchange=drawSlip; drawSlip();
  const sel=document.getElementById('who');
  const who=(sel&&document.getElementById('t1').classList.contains('on'))
    ?sel.options[sel.selectedIndex].text:'';
  return `Viewing: ${label}${who?' · '+who:''} · pull ${D.pull}`;
}
let ctxPerson=null;
function approveSlip(p){
  const S=D.slip, conf=S.confirmed[p.name]||0, deals=S.deals[p.name]||[];
  const s=encodeURIComponent(`Commission approved — ${p.name} — cycle ${S.cycle}`);
  const lines=deals.map(d=>`  ${d.son}  ${d.deal}  ${fmt2(d.share)}`).join('\n');
  const b=encodeURIComponent(
    `${p.name} has approved their commission for the cycle ending ${S.cycle}.\n\n`+
    `Confirmed commission: ${fmt2(conf)}\n\nDeals:\n${lines}\n\n`+
    `---\nApproved from the Ampra Commission Tracker. Record this against the log at the `+
    `next update so it counts as paid for future cycles.`);
  window.location.href=`mailto:${S.approve_to}?cc=${S.approve_cc}&subject=${s}&body=${b}`;
  const ap=document.getElementById('approve');
  ap.disabled=true; ap.textContent='Approval sent';
}
const modal=document.getElementById('modal');
const mname=document.getElementById('mname'), mmsg=document.getElementById('mmsg');
const msend=document.getElementById('msend');
function validate(){msend.disabled=!(mname.value.trim()&&mmsg.value.trim());}
mname.addEventListener('input',validate); mmsg.addEventListener('input',validate);
function openModal(){
  document.getElementById('mctx').textContent=ctxNow();
  modal.classList.add('on'); validate(); mname.focus();
}
function closeModal(){modal.classList.remove('on');}
document.getElementById('dis').onclick=()=>{ctxPerson=null;openModal();};
document.getElementById('mcancel').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('on'))closeModal();});
msend.onclick=()=>{
  // A slip flag routes to Scott with Joe and Ollie copied; a general flag goes to Ollie.
  const slipFlag=ctxPerson!==null;
  const to=slipFlag?D.slip.flag_to:'ollie@ampra.au';
  const cc=slipFlag?D.slip.flag_cc:'scott@ampra.au';
  const s=encodeURIComponent(slipFlag
    ?`Commission query — ${ctxPerson} — cycle ${D.slip.cycle}`
    :'Ampra Commission Tracker — possible discrepancy ('+D.pull+')');
  const b=encodeURIComponent(
    'Raised by: '+mname.value.trim()+'\n\n'+
    'What looks off:\n'+mmsg.value.trim()+'\n\n'+
    '---\n'+ctxNow()+'\nPositions from '+D.reset+' onward · ad spend to '+D.adspend_to+'.\n'+
    'All pending deals are based on cash amounts and may change with finance and ACP charges.');
  window.location.href=`mailto:${to}?cc=${cc}&subject=${s}&body=${b}`;
  ctxPerson=null; closeModal();};
</script></body></html>
